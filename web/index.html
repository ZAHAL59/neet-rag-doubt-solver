<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET Doubt Solver</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--accent:#2563eb;--soft:#eff4ff;--warn:#b45309;--warn-bg:#fff7ed}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111c33;--ink:#e8edf7;--muted:#a5b2c8;--line:#25324d;--accent:#7aa7ff;--soft:#16264a;--warn:#fbbf24;--warn-bg:#2a210e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 120px}
header h1{margin:0;font-size:26px;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--card)}
.samples{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.samples button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
.samples button:hover{border-color:var(--accent)}
.msg{margin:16px 0}
.q{background:var(--soft);border-radius:14px;padding:12px 16px;font-weight:600}
.a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.a.out{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.a .cite{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:6px;padding:0 6px;margin:0 1px}
.src{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.src summary{cursor:pointer;color:var(--muted);font-size:14px}
.src ol{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.src li{margin-bottom:6px}
.src b{color:var(--ink)}
.foot{font-size:12px;color:var(--muted);margin-top:8px}
form{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
.bar{max-width:820px;margin:0 auto;display:flex;gap:8px}
select,input,button.send{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:46px;padding:0 12px}
input{flex:1;min-width:0}
button.send{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:0 18px;cursor:pointer}
button.send:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:560px){select{max-width:100px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NEET Doubt Solver</h1>
    <p>Ask a doubt. Answers come only from the study notes, with numbered citations.</p>
    <div class="meta" id="meta"></div>
  </header>
  <div class="samples" id="samples"></div>
  <div id="chat" aria-live="polite"></div>
</div>
<form id="form">
  <div class="bar">
    <select id="subject" aria-label="Subject filter">
      <option value="">All subjects</option><option>Biology</option><option>Physics</option><option>Chemistry</option>
    </select>
    <input id="q" placeholder="e.g. Why is O2 paramagnetic?" autocomplete="off" aria-label="Your question" required minlength="3">
    <button class="send" id="send">Ask</button>
  </div>
</form>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),q=document.getElementById('q'),send=document.getElementById('send'),subj=document.getElementById('subject');
const samples=["What is the first stable product of the C4 pathway?","Why is O2 paramagnetic?","Which enzyme activates trypsinogen?","Why does a cricketer pull his hands back while catching?","What is the F2 ratio in a dihybrid cross?","Who won the 2011 cricket world cup?"];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
samples.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>{q.value=s;form.requestSubmit()};document.getElementById('samples').appendChild(b)});
fetch('/api/stats').then(r=>r.json()).then(s=>{document.getElementById('meta').innerHTML=[`${s.chunks} chunks`,`${s.files} notes`,`embeddings: ${s.embedder}`,`LLM: ${s.llm_provider}`].map(t=>`<span class="pill">${esc(t)}</span>`).join('')}).catch(()=>{});
form.addEventListener('submit',async e=>{
  e.preventDefault();const question=q.value.trim();if(question.length<3)return;
  const box=document.createElement('div');box.className='msg';box.innerHTML=`<div class="q">${esc(question)}</div><div class="a">Thinking…</div>`;chat.prepend(box);
  q.value='';send.disabled=true;
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,subject:subj.value||null})});
    if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
    const d=await r.json();const a=box.querySelector('.a');
    a.className='a'+(d.in_scope?'':' out');
    let html=esc(d.answer).replace(/\[(\d+)\]/g,'<span class="cite">$1</span>').replace(/\n/g,'<br>');
    if(d.sources.length){html+=`<details class="src"><summary>${d.sources.length} source${d.sources.length>1?'s':''} from the notes</summary><ol>`+d.sources.map(s=>`<li value="${s.ref}"><b>${esc(s.chapter)} › ${esc(s.section)}</b> (${esc(s.subject)}, similarity ${s.score})<br>${esc(s.excerpt)}…</li>`).join('')+'</ol></details>'}
    html+=`<div class="foot">${d.latency_ms} ms · ${esc(d.provider)}</div>`;a.innerHTML=html;
  }catch(err){box.querySelector('.a').textContent='Error: '+err.message}
  finally{send.disabled=false;q.focus()}
});
</script>
</body>
</html>
